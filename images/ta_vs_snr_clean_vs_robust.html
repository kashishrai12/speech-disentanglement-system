<div style="display: flex; flex-wrap: wrap; gap: 16px; margin: 0 0 12px; font-size: 12px; color: var(--color-text-secondary);">
  <span style="display: flex; align-items: center; gap: 6px;">
    <span style="width: 18px; height: 2px; background: #888780; display: inline-block;"></span>
    Clean-distilled SV (baseline)
  </span>
  <span style="display: flex; align-items: center; gap: 6px;">
    <span style="width: 18px; height: 2px; background: #1D9E75; display: inline-block;"></span>
    Noise-augmented SV (final)
  </span>
  <span style="display: flex; align-items: center; gap: 6px;">
    <span style="width: 18px; border-top: 2px dashed #5F5E5A; display: inline-block;"></span>
    KPI target (90%)
  </span>
</div>

<div style="position: relative; width: 100%; height: 320px;">
  <canvas id="taChart" role="img" aria-label="True accept rate vs SNR. Clean-distilled model: 60% at 30 dB, 33% at 10 dB, 20% at 0 dB, 0% at minus 5 dB. Noise-augmented model: 60% at 30 dB, 60% at 10 dB, 47% at 0 dB, 33% at minus 5 dB. KPI target line at 90%.">
    TA vs SNR comparison. Clean model collapses to 0% at -5 dB. Robust model holds 33% at -5 dB and 60% in the usable SNR range.
  </canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
new Chart(document.getElementById('taChart'), {
  type: 'line',
  data: {
    labels: ['-5 dB', '0 dB', '10 dB', '30 dB'],
    datasets: [
      {
        label: 'Clean SV',
        data: [0, 20, 33, 60],
        borderColor: '#888780',
        backgroundColor: '#888780',
        borderDash: [6, 4],
        pointStyle: 'rect',
        pointRadius: 5,
        tension: 0.2,
      },
      {
        label: 'Robust SV',
        data: [33, 47, 60, 60],
        borderColor: '#1D9E75',
        backgroundColor: '#1D9E75',
        pointStyle: 'circle',
        pointRadius: 5,
        tension: 0.2,
      },
      {
        label: 'KPI target',
        data: [90, 90, 90, 90],
        borderColor: '#5F5E5A',
        borderDash: [2, 4],
        borderWidth: 1,
        pointRadius: 0,
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: { callbacks: { label: (ctx) => ctx.dataset.label + ': ' + ctx.parsed.y + '%' } }
    },
    scales: {
      y: {
        min: 0,
        max: 100,
        ticks: { callback: (v) => v + '%' },
        title: { display: true, text: 'True accept rate' }
      },
      x: {
        title: { display: true, text: 'Signal-to-noise ratio' }
      }
    }
  }
});
</script>
